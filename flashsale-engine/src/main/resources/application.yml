server:
  port: ${PORT:8080}   # hosts like Render pass the port to listen on in PORT
  # Behind a hosting proxy (Render etc.) set FORWARD_HEADERS_STRATEGY=framework so client IPs
  # (used by the login limits) come from X-Forwarded-For. Leave "none" when not behind a proxy.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: flashsale-engine
  config:
    # Local secrets (JWT_SECRET, ADMIN_PASSWORD, later cloud URIs) live in .env, which is git-ignored.
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  mongodb:
    uri: mongodb://localhost:27017/flashsale?replicaSet=rs0
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    # Local: Mailpit (fake inbox at http://localhost:8025). Hosted: any SMTP, e.g. Brevo, via env vars.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  task:
    scheduling:
      pool:
        size: 4          # a slow job (e.g. outbox while Kafka is down) must not stall the others
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.block.ms: 5000   # fail fast instead of blocking 60 s when Kafka is unreachable
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      concurrency: 3

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 8h
  admin:
    username: admin
    password: ${ADMIN_PASSWORD:}
  booking:
    hold-ttl: 5m
    payment-hold-extension: 2m
    max-seats-per-user: 4
  rate-limit:
    per-user-per-second: 10
  auth:
    max-failed-logins: 5              # then the account is locked for lock-duration
    lock-duration: 15m
    failed-logins-per-ip-per-minute: 20
    registrations-per-ip-per-hour: 20
    email-verification-validity: 24h
    cookie-secure: ${COOKIE_SECURE:false}   # true when served over HTTPS
  payment:
    delay: 1500ms
    slow-delay: 8s
    random-success-rate: 0.7
  kafka:
    partitions: 3
    replicas: 1
  mail:
    from: "FlashSale <tickets@flashsale.local>"
    app-url: http://localhost:8080
    timezone: Asia/Kolkata
  notifications:
    reminder-before: 24h
  retention:                  # TTL cleanup; confirmed bookings and payments are never deleted
    outbox: 7d                # published outbox rows
    notifications: 90d        # email send log
    abandoned-bookings: 30d   # FAILED / EXPIRED / CANCELLED bookings

management:
  health:
    mail:
      enabled: false   # email is best-effort; a mail outage must not mark the booking app DOWN
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
